<style>

    display: inline-block;
    margin-bottom: 2rem;
  }
  .back-link:hover, .back-link:focus { color: var(--accent-dark); }

  h1 {
    font-family: var(--sans);
    font-size: 1.6rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0 0 1.5rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--rule);
  }

  ul.offers { list-style: none; margin: 0; padding: 0; }
  ul.offers li {
    padding: 0.9rem 0 0.9rem 1rem;
    border-left: 2px solid var(--rule);
    margin-bottom: 0.6rem;
    max-width: 62ch;
  }

  .empty-note {
    font-family: var(--sans);
    color: var(--text-muted);
    font-size: 0.95rem;
  }
</style>
